<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>健身助手二次开发 · 需求调研问卷 v1</title>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --ink2:#6b7280;
    --accent:#ea580c; --accent-soft:#fff7ed; --ok:#16a34a;
    --line:#e5e7eb; --radius:14px; --high:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.55;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  header{
    background:linear-gradient(135deg,#1f2937 0%,#111827 100%);
    color:#fff; padding:20px 16px 16px;
  }
  header h1{margin:0 0 6px;font-size:20px}
  header p{margin:0;color:#d1d5db;font-size:14px}
  header .meta{margin-top:10px;font-size:13px;color:#fbbf24}
  main{padding:12px 12px 0;max-width:680px;margin:0 auto}
  details.card{
    background:var(--card); border-radius:var(--radius);
    margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06);
    overflow:hidden;
  }
  details.card summary{
    list-style:none; cursor:pointer; padding:14px 14px;
    display:flex; align-items:center; gap:10px;
    -webkit-tap-highlight-color:transparent;
  }
  details.card summary::-webkit-details-marker{display:none}
  details.card summary .t{flex:1;min-width:0}
  details.card summary .t b{font-size:17px}
  details.card summary .t small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
  .badge{
    flex:none; font-size:12px; padding:3px 9px; border-radius:99px;
    background:var(--line); color:var(--ink2); font-variant-numeric:tabular-nums;
  }
  .badge.done{background:#dcfce7;color:var(--ok)}
  .chev{flex:none;color:var(--ink2);font-size:13px;transition:transform .2s}
  details[open] .chev{transform:rotate(90deg)}
  .sec-desc{padding:0 14px 10px;color:var(--ink2);font-size:13.5px}
  .q{padding:6px 14px 14px;border-top:1px dashed var(--line)}
  .q:first-of-type{border-top:none}
  .q-label{margin:10px 0 4px;font-size:16px;font-weight:600}
  .q-label .fire{color:var(--high);margin-right:4px}
  .q-hint{color:var(--ink2);font-size:13px;margin:0 0 10px}
  .rec{
    margin:0 0 10px;font-size:13px;color:#065f46;
    background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:8px 10px;
  }
  .rec-btn{
    display:inline-block;margin-left:6px;color:var(--accent);font-weight:700;
    cursor:pointer;text-decoration:underline;-webkit-tap-highlight-color:transparent;
  }
  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pill{
    border:1.5px solid var(--line); background:#fafafa; color:var(--ink);
    border-radius:11px; padding:9px 13px; font-size:15px; cursor:pointer;
    min-height:44px; display:inline-flex; align-items:center;
    -webkit-tap-highlight-color:transparent; user-select:none;
    transition:all .12s;
  }
  .pill:active{transform:scale(.97)}
  .pill.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .pill .ord{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:12px;margin-right:6px;font-weight:700;
  }
  textarea, input[type=text]{
    width:100%; font-size:16px; padding:10px 12px; margin-top:8px;
    border:1.5px solid var(--line); border-radius:11px; background:#fafafa;
    font-family:inherit; color:var(--ink); resize:vertical;
  }
  textarea:focus, input:focus{outline:none;border-color:var(--accent)}
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--card); border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:10px; align-items:center; max-width:680px; margin:0 auto;
  }
  .progress-wrap{flex:1;min-width:0}
  .progress-text{font-size:12px;color:var(--ink2);margin-bottom:4px;font-variant-numeric:tabular-nums}
  .progress-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
  .btn{
    border:none;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;
    cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line)}
  .modal{
    position:fixed;inset:0;z-index:100;display:none;
    background:rgba(0,0,0,.5);padding:16px;
  }
  .modal.show{display:flex;align-items:flex-end}
  .modal-box{
    background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:648px;
    margin:0 auto;max-height:86vh;display:flex;flex-direction:column;
  }
  .modal-box h3{margin:0 0 8px;font-size:17px}
  .modal-box textarea{
    flex:1;min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:13px;
    background:#f8fafc;margin-top:0;
  }
  .modal-actions{display:flex;gap:8px;margin-top:12px}
  .modal-actions .btn{flex:1}
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
    background:#111827;color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:200;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1>🏋️ 健身助手二次开发 · 需求调研</h1>
  <p>这一轮只做需求澄清：把你的真实使用方式和期望摸清楚，再动代码。问题基于现有功能设计——现有实现（19 个动作、A/B/C 课表、配额与分餐引擎等）不再重复问你。</p>
  <p class="meta">共 <b id="totalQ">-</b> 题 · 约 15-20 分钟 · 答案自动保存在本机 · 🔥 = 高优先级，尽量都答 · 填完点底部「导出结果」把文本发给 AI</p>
</header>
<main id="app"></main>

<div class="bottombar">
  <div class="progress-wrap">
    <div class="progress-text"><span id="progPct">0%</span> · <span id="progNum">0/0</span> 题 · 🔥 <span id="progHigh">0/0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <button class="btn btn-primary" id="btnExport">导出结果</button>
</div>

<div class="modal" id="exportModal">
  <div class="modal-box">
    <h3>导出结果</h3>
    <p style="margin:0 0 8px;color:var(--ink2);font-size:13px">点「复制到剪贴板」后直接粘贴给 AI；若复制失败（部分手机浏览器限制），长按下方文本框全选手动复制，或点「下载 txt」。</p>
    <textarea id="exportText" readonly spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnCopy">复制</button>
      <button class="btn btn-ghost" id="btnDownload">下载 txt</button>
      <button class="btn btn-ghost" id="btnClose">关闭</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- 问卷数据（MECE：每题只问一件事；已知实现事实写进提示，不问机器能查到的） ---------- */

var SECTIONS = [
{ id:"s0", icon:"👤", title:"使用者与设备画像", desc:"先搞清楚你在什么设备、什么场景下用，这决定所有交互设计和 Apple Watch 路线。", questions:[

/* ---------- 状态 ---------- */
var LS_KEY = "jsas_survey_v1";
var answers = {};        // { qid: { choice:[], text:"" } }
var openSections = {};   // { secId: true/false }
try { answers = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e) { answers = {}; }

function saveState(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(answers)); } catch(e){}
}
function allQuestions(){
  var list = [];
  SECTIONS.forEach(function(s){ s.questions.forEach(function(q){ list.push(q); }); });
  return list;
}
function getAns(qid){
  if(!answers[qid]) answers[qid] = { choice:[], text:"" };
  return answers[qid];
}
function isAnswered(q){
  var a = getAns(q.id);
  if(q.type === "text") return !!(a.text && a.text.trim());
  return a.choice.length > 0;
}

/* ---------- 渲染 ---------- */
var app = document.getElementById("app");
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function render(){
  var html = [];
  var all = allQuestions();
  document.getElementById("totalQ").textContent = all.length;
  SECTIONS.forEach(function(s, si){
    var done = s.questions.filter(isAnswered).length;
    var open = openSections[s.id] !== undefined ? openSections[s.id] : (si === 0);
    html.push('<details class="card" data-sec="'+s.id+'"'+(open?" open":"")+'>');
    html.push('<summary><span class="chev">▶</span><span class="t"><b>'+s.icon+" "+s.title+'</b><small>'+s.desc+'</small></span>');
    html.push('<span class="badge'+(done===s.questions.length?" done":"")+'">'+done+"/"+s.questions.length+'</span></summary>');
    s.questions.forEach(function(q){
      html.push(renderQuestion(q, s));
    });
    html.push('</details>');
  });
  app.innerHTML = html.join("");
  updateProgress();
}
function renderQuestion(q, sec){
  var a = getAns(q.id);
  var h = '<div class="q" data-q="'+q.id+'">';
  h += '<div class="q-label">'+(q.high?'<span class="fire">🔥</span>':"")+esc(q.label)+'</div>';
  if(q.hint) h += '<p class="q-hint">💡 '+esc(q.hint)+'</p>';
  if(REC[q.id]){
    var recArr = Array.isArray(REC[q.id]) ? REC[q.id] : [REC[q.id]];
    var recText = recArr.join(" + ") + (REC_NOTE[q.id] ? "（"+REC_NOTE[q.id]+"）" : "");
    h += '<div class="rec">➡️ 建议：'+esc(recText)+'<span class="rec-btn" data-rec="'+q.id+'">采纳</span></div>';
  }
  if(q.options.length){
    h += '<div class="pills">';
    q.options.forEach(function(opt, oi){
      var sel = a.choice.indexOf(opt) >= 0;
      var ordMark = "";
      if(q.type === "rank3" && sel){
        ordMark = '<span class="ord">'+(a.choice.indexOf(opt)+1)+'</span>';
      }
      h += '<span class="pill'+(sel?" sel":"")+'" data-qi="'+oi+'">'+ordMark+esc(opt)+'</span>';
    });
    h += '</div>';
  }
  if(q.type === "text" || q.type === "multi+text" || q.type === "radio+text"){
    h += '<textarea rows="'+(q.type==="text"?3:2)+'" placeholder="补充说明（可空）" data-text="'+q.id+'">'+esc(a.text||"")+'</textarea>';
  }
  h += '</div>';
  return h;
}

/* ---------- 交互 ---------- */
app.addEventListener("click", function(ev){
  var recBtn = ev.target.closest(".rec-btn");
  if(recBtn){
    var rqid = recBtn.getAttribute("data-rec");
    getAns(rqid).choice = Array.isArray(REC[rqid]) ? REC[rqid].slice() : [REC[rqid]];
    saveState();
    refreshQuestion(rqid);
    updateProgress();
    return;
  }
  var pill = ev.target.closest(".pill");
  if(pill){
    var qDiv = pill.closest(".q");
    var qid = qDiv.getAttribute("data-q");
    var q = findQ(qid);
    var opt = q.options[parseInt(pill.getAttribute("data-qi"), 10)];
    var a = getAns(qid);
    if(q.type === "radio" || q.type === "radio+text"){
      a.choice = (a.choice[0] === opt) ? [] : [opt];
    } else if(q.type === "multi" || q.type === "multi+text"){
      var i = a.choice.indexOf(opt);
      if(i >= 0) a.choice.splice(i, 1); else a.choice.push(opt);
    } else if(q.type === "rank3"){
      var j = a.choice.indexOf(opt);
      if(j >= 0) a.choice.splice(j, 1);
      else if(a.choice.length < 3) a.choice.push(opt);
    }
    saveState();
    refreshQuestion(qid);
    updateProgress();
    return;
  }
  var summary = ev.target.closest("summary");
  if(summary){
    var card = summary.closest(".card");
    var sid = card.getAttribute("data-sec");
    // details 状态在 click 后才翻转，延时记录
    setTimeout(function(){ openSections[sid] = card.hasAttribute("open"); saveState(); }, 0);
  }
});
app.addEventListener("input", function(ev){
  var ta = ev.target.closest("textarea");
  if(ta){
    var qid = ta.getAttribute("data-text");
    getAns(qid).text = ta.value;
    saveState();
    updateProgress();
  }
});
function findQ(qid){
  var found = null;
  SECTIONS.forEach(function(s){ s.questions.forEach(function(q){ if(q.id === qid) found = q; }); });
  return found;
}
function refreshQuestion(qid){
  var sec = null;
  SECTIONS.forEach(function(s){ if(s.questions.some(function(q){ return q.id===qid; })) sec = s; });
  var q = findQ(qid);
  var div = app.querySelector('.q[data-q="'+qid+'"]');
  if(div){ div.outerHTML = renderQuestion(q, sec); }
  var card = app.querySelector('.card[data-sec="'+sec.id+'"]');
  if(card){
    var badge = card.querySelector(".badge");
    var done = sec.questions.filter(isAnswered).length;
    badge.textContent = done+"/"+sec.questions.length;
    badge.className = "badge" + (done===sec.questions.length ? " done" : "");
  }
}
function updateProgress(){
  var all = allQuestions();
  var done = all.filter(isAnswered).length;
  var highAll = all.filter(function(q){ return q.high; });
  var highDone = highAll.filter(isAnswered).length;
  document.getElementById("progPct").textContent = Math.round(done/all.length*100)+"%";
  document.getElementById("progNum").textContent = done+"/"+all.length;
  document.getElementById("progHigh").textContent = highDone+"/"+highAll.length;
  document.getElementById("progFill").style.width = Math.round(done/all.length*100)+"%";
}

document.getElementById("btnCopy").addEventListener("click", function(){
  var text = document.getElementById("exportText").value;

    navigator.clipboard.writeText(text).then(function(){ showToast("✅ 已复制"); }, function(){ showToast("❌ 复制被拒绝，请长按文本手动全选复制"); });
  } else {
    var ta = document.getElementById("exportText");
    ta.removeAttribute("readonly");
    ta.select();
    try { document.execCommand("copy"); showToast("✅ 已复制"); }
    catch(e){ showToast("请长按文本手动全选复制"); }
    ta.setAttribute("readonly","readonly");
  }
});
document.getElementById("btnDownload").addEventListener("click", function(){
  var text = document.getElementById("exportText").value;
  var blob = new Blob([text], { type:"text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "健身助手需求调研-作答.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  showToast("已开始下载");
});
var CN_NUM = ["一","二","三","四","五","六","七","八","九","十"];
function buildExport(){
  var all = allQuestions();
  var lines = [];
  var now = new Date();
  var pad = function(n){ return (n<10?"0":"")+n; };
  var stamp = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+" "+pad(now.getHours())+":"+pad(now.getMinutes());
  lines.push("健身助手二次开发 · 需求澄清问卷 v1（作答结果）");
  lines.push("导出时间："+stamp);
  var done = all.filter(isAnswered).length;
  lines.push("作答进度："+done+"/"+all.length);
  var missHigh = all.filter(function(q){ return q.high && !isAnswered(q); });
  if(missHigh.length){
    lines.push("");
    lines.push("【未答的高优先级题，建议补答】");
    missHigh.forEach(function(q){ lines.push("- "+q.label); });
  }
  lines.push("");
  lines.push("━━━━━━━━━━━━━━━━━━━━");
  SECTIONS.forEach(function(s, si){
    lines.push("");
    lines.push("【"+(CN_NUM[si]||si+1)+" "+s.title+"】");
    var no = 0;
    s.questions.forEach(function(q){
      no++;
      var a = getAns(q.id);
      var answered = isAnswered(q);
      lines.push("");
      var prefix = (q.high ? "🔥" : "") + (answered ? "" : "〔未答〕");
      lines.push(prefix+"Q"+(si+1)+"."+no+" "+q.label);
      if(a.choice.length){
        if(q.type === "rank3"){
          lines.push("  排序：" + a.choice.map(function(c, i){ return ["①","②","③"][i]+" "+c; }).join("  →  "));
        } else {
          lines.push("  答："+a.choice.join("；"));
        }
        if(q.type !== "rank3" && REC[q.id] && a.choice.length === 1){
          var recIsArr = Array.isArray(REC[q.id]);
          var recStr = recIsArr ? REC[q.id].join("、") : REC[q.id];
          if(a.choice[0] !== recStr && !(recIsArr && REC[q.id].length===1 && REC[q.id][0]===a.choice[0])){
            lines.push("  （AI 原建议："+recStr+(REC_NOTE[q.id] ? "——"+REC_NOTE[q.id] : "")+"）");
          }
        }
      }
      if(a.text && a.text.trim()){
        lines.push("  补充："+a.text.trim().replace(/\n+/g, " / "));
      }
    });
  });
  return lines.join("\n");
}

/* ---------- 启动 ---------- */
try {
  openSections = JSON.parse(localStorage.getItem(LS_KEY+"_sections") || "{}");
} catch(e){ openSections = {}; }
var _origSave = saveState;
saveState = function(){
  _origSave();
  try { localStorage.setItem(LS_KEY+"_sections", JSON.stringify(openSections)); } catch(e){}
};
render();
</script>

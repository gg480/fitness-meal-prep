name: docker-publish

# 云构建发布镜像：master 推送 → :latest；打 v* 标签 → :版本号 + :latest
# 需要仓库 Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (多架构)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # master：构建并推送 :latest
      - name: Build and push :latest
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lrunningmjgoat/fitness-meal-prep:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # v* 标签：构建并推送 :版本号 + :latest
      - name: Build and push version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lrunningmjgoat/fitness-meal-prep:${{ github.ref_name }}
            lrunningmjgoat/fitness-meal-prep:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
